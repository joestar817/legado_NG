def ngDesignBaselineFile = rootProject.file("config/ng-design-system-baseline.txt")

roborazzi {
    outputDir.set(file("src/test/screenshots"))
}

def ngDesignRules = [
        hex           : ~/(?i)#[0-9a-f]{6,8}/,
        theme_store   : ~/\bThemeStore\b/,
        private_scheme: ~/\b(lightColorScheme|darkColorScheme)\s*\(/,
        visual_boolean: ~/\b(useWhiteBackground|disableGlass|useSurfaceBackground|useDarkText|useStrongBorder)\b/
]

tasks.register("verifyNgDesignSystem") {
    group = "verification"
    description = "阻止 Feature 新增绕过 NG Design System 的视觉实现"

    doLast {
        def baseline = [:].withDefault { 0 }
        if (ngDesignBaselineFile.exists()) {
            ngDesignBaselineFile.eachLine("UTF-8") { line ->
                def normalized = line.trim()
                if (normalized && !normalized.startsWith("#")) {
                    def parts = normalized.split("\\|", 3)
                    if (parts.length == 3) baseline[parts[0] + "|" + parts[1]] = parts[2] as int
                }
            }
        }

        def sources = files(
                fileTree("src/main/java/io/legado/app/ui") { include "**/*.kt" },
                fileTree("src/main/res/layout") { include "**/*.xml" }
        )
        def failures = []
        ngDesignRules.each { ruleName, pattern ->
            sources.files.sort().each { source ->
                def relative = rootProject.projectDir.toPath().relativize(source.toPath())
                        .toString().replace('\\', '/')
                if (relative.contains("/ui/design/")) return
                def matcher = pattern.matcher(source.getText("UTF-8"))
                def count = 0
                while (matcher.find()) count++
                def allowed = baseline[ruleName + "|" + relative]
                if (count > allowed) failures << "${ruleName}|${relative}|${count} (baseline ${allowed})"
            }
        }

        fileTree("src/main/res/layout") { include "**/item_*.xml" }.files.each { source ->
            if (source.getText("UTF-8").contains("NgGlassLayout")) {
                failures << "recycler_glass|${rootProject.projectDir.toPath().relativize(source.toPath()).toString().replace('\\', '/')}"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("NG Design System 检查失败:\n" + failures.join("\n"))
        }
    }
}

tasks.named("check").configure {
    dependsOn(tasks.named("verifyNgDesignSystem"))
}

def resolveAdbExecutable = {
    def sdkDir = null
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        sdkDir = localProperties.getProperty("sdk.dir")
    }
    sdkDir = sdkDir ?: System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (!sdkDir) {
        throw new GradleException("Android SDK path not found. Set sdk.dir in local.properties or ANDROID_HOME/ANDROID_SDK_ROOT.")
    }

    def adbName = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows") ? "adb.exe" : "adb"
    def adbExecutable = new File(new File(sdkDir, "platform-tools"), adbName)
    if (!adbExecutable.isFile()) {
        throw new GradleException("adb not found at ${adbExecutable}. Check Android SDK installation.")
    }
    return adbExecutable.absolutePath
}

tasks.register("installAppDebugStreaming", Exec) {
    group = "install"
    description = "Installs the AppDebug APK with adb streaming install."
    dependsOn("assembleAppDebug")

    doFirst {
        def apkDir = layout.buildDirectory.dir("outputs/apk/app/debug").get().asFile
        def apkFiles = apkDir.exists() ? apkDir.listFiles().findAll { it.name.endsWith(".apk") } : []
        if (!apkFiles) {
            throw new GradleException("AppDebug APK not found in ${apkDir}.")
        }
        def apkFile = apkFiles.max { it.lastModified() }
        commandLine(resolveAdbExecutable(), "install", "--streaming", "-r", "-d", apkFile.absolutePath)
    }
}

tasks.matching { it.name == "installAppDebug" }.configureEach {
    dependsOn("installAppDebugStreaming")
    enabled = false
}
