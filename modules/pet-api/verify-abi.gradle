import java.util.jar.JarFile
import java.util.zip.ZipFile

// Capture the JVM-visible public surface used by existing compiled plugins.
def releaseAar = layout.buildDirectory.file('outputs/aar/pet-api-release.aar')
def snapshots = [file('api-v2.txt'), file('api-v3-additions.txt'), file('api-v4-additions.txt')]
tasks.register('verifyPetAbi') {
    dependsOn 'bundleReleaseAar'
    inputs.file(releaseAar)
    inputs.files(snapshots)
    doLast {
        def jar = new File(temporaryDir, 'pet-api.jar')
        new ZipFile(releaseAar.get().asFile).withCloseable { archive ->
            archive.getInputStream(archive.getEntry('classes.jar')).withCloseable { input ->
                jar.withOutputStream { output -> input.transferTo(output) }
            }
        }
        def types = new JarFile(jar).withCloseable { archive ->
            archive.entries().findAll { it.name.endsWith('.class') }
                .collect { it.name.substring(0, it.name.size() - 6).replace('/', '.') }
                .sort()
        }
        def executable = new File(System.getProperty('java.home'), 'bin/javap')
        if (!executable.exists()) executable = new File(executable.path + '.exe')
        def output = providers.exec {
            commandLine([executable.absolutePath, '-public', '-classpath', jar.absolutePath] + types)
        }.standardOutput.asText.get()
        String owner = null
        def actual = []
        output.readLines().each { raw ->
            def line = raw.trim()
            if (line.endsWith(' {')) {
                owner = types.find { line.contains(" ${it} ") || line.contains(" ${it}<") }
                if (owner == null) throw new GradleException("Unexpected javap declaration: ${line}")
                actual << line.substring(0, line.size() - 2)
            } else if (owner != null && line.startsWith('public ')) {
                actual << "${owner} ${line}".toString()
            }
        }
        def expected = snapshots.collectMany { it.readLines('UTF-8').findAll { line -> line } }.sort()
        if (actual.sort() != expected) {
            throw new GradleException("Pet API differs from the frozen signatures. Removed: ${expected - actual}; added: ${actual - expected}")
        }
    }
}
