plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
}
android {
    namespace = 'io.legado.pet.api'
    compileSdk = compile_sdk_version
    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

apply from: 'verify-abi.gradle'

// This distribution is the entire build-time dependency of an independently authored pet.
tasks.register('exportPetSdk', Zip) {
    dependsOn 'verifyPetAbi'
    archiveFileName = 'pet-sdk-2.1.0.zip'
    destinationDirectory = rootProject.layout.buildDirectory.dir('outputs/pet-sdk')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from({ zipTree(layout.buildDirectory.file('outputs/aar/pet-api-release.aar').get().asFile) }) {
        include 'classes.jar'
        into 'lib'
        rename { 'pet-api-2.0.0.jar' }
    }
    from(rootProject.file('plugins/sdk')) { exclude '**/build/**', '**/.gradle/**', '**/local.properties' }
    from(rootProject.file('plugins/README.md'))
    from(file('api-v2.txt')) { into 'lib' }
    from(rootProject.file('gradle/wrapper')) { into 'gradle/wrapper' }
    from(rootProject.file('gradlew.bat'))
    from(rootProject.file('gradlew')) {
        filter([eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf')], org.apache.tools.ant.filters.FixCrLfFilter)
        filePermissions { unix('rwxr-xr-x') }
    }
}
